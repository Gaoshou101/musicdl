<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Midnight blue single music note banner</title>
  <desc id="description">A single rounded eighth note centered in quiet silver on a midnight blue gradient.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111E"/>
      <stop offset="0.5" stop-color="#122136"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <radialGradient id="tone" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#5A7188" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#29415A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#07101C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="note" x1="0.2" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E8EEF4"/>
      <stop offset="1" stop-color="#BFCBD7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-24%" y="-20%" width="148%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#020812" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#tone)"/>
  <path
    d="M 512 236
       C 512 214 530 196 552 196
       H 598
       C 694 196 756 255 756 328
       C 756 389 721 434 670 450
       C 700 416 706 374 690 341
       C 671 302 635 286 588 286
       V 625
       C 613 642 628 665 628 692
       C 628 776 554 829 456 829
       C 354 829 282 777 282 690
       C 282 621 345 569 431 561
       C 462 558 491 565 512 578
       Z"
    fill="url(#note)"
    filter="url(#soft-shadow)"
    transform="translate(380 35) scale(0.81)"
  />
</svg>

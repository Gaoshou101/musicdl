<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Midnight blue single music note icon</title>
  <desc id="description">A centered rounded eighth note in quiet silver on a midnight blue gradient.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111E"/>
      <stop offset="0.52" stop-color="#122136"/>
      <stop offset="1" stop-color="#091321"/>
    </linearGradient>
    <radialGradient id="tone" cx="50%" cy="33%" r="74%">
      <stop offset="0" stop-color="#5A7188" stop-opacity="0.23"/>
      <stop offset="0.56" stop-color="#29415A" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#07101C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="note" x1="0.2" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E8EEF4"/>
      <stop offset="1" stop-color="#BFCBD7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-24%" y="-20%" width="148%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#020812" flood-opacity="0.48"/>

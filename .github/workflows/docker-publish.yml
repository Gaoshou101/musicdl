name: Publish Docker images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  NAMESPACE: wit7zz

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.value }}
      main: ${{ steps.main.outputs.digest }}
      runner: ${{ steps.runner.outputs.digest }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release checker dependency
        run: python -m pip install 'PyYAML>=6.0.2,<7'
      - name: Verify numbered release before publishing
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release/verify_release.py preflight --tag "${{ github.ref_name }}" --require-ci --json

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch may refresh latest, but may not rewrite a
            # numbered image without also updating its GitHub Release.
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push main image
        id: main
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: docker/main/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/musicdl:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/musicdl:latest
          cache-from: type=gha,scope=musicdl-main
          cache-to: type=gha,mode=max,scope=musicdl-main

      - name: Build and push plugin runner image
        id: runner
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: docker/plugin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/musicdl-plugin-runner:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/musicdl-plugin-runner:latest
          cache-from: type=gha,scope=musicdl-plugin-runner
          cache-to: type=gha,mode=max,scope=musicdl-plugin-runner

  # A tag is only half of a release: the GitHub Release is the other half and
  # it has to carry the same source commit and the image digests this run just
  # published. Doing it here -- rather than in a separate workflow -- is what
  # makes the two impossible to drift apart. Re-running the workflow for a tag
  # updates the existing release instead of failing, which is how a release
  # that was created before its images finished gets its digests filled in.
  release:
    name: Publish GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create or update the release for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          version="${{ needs.publish.outputs.version }}"
          main_digest="${{ needs.publish.outputs.main }}"
          runner_digest="${{ needs.publish.outputs.runner }}"
          notes="docs/release-notes/${tag}.md"

          if [[ -z "${version}" || -z "${main_digest}" || -z "${runner_digest}" ]]; then
            echo "::error::the publish job did not report a version and both image digests"
            exit 1
          fi

          if [[ ! -f "${notes}" ]]; then
            echo "::error::required release notes ${notes} are missing"
            exit 1
          fi
          body="$(mktemp)"
          source_commit="$(git rev-parse HEAD)"
          python scripts/release/verify_release.py body --tag "${tag}" \
            --source-commit "${source_commit}" --main-digest "${main_digest}" \
            --runner-digest "${runner_digest}" > "${body}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "musicdl ${version}" --notes-file "${body}"
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "musicdl ${version}" --notes-file "${body}" --verify-tag
          fi
          echo "published GitHub release ${tag}"

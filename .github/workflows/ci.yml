# Continuous integration for the release gates.
#
# Two gates are deliberately absent because a hosted runner cannot decide them
# honestly, and a job that cannot really run a gate must never report PASS:
#   * wecom-callback  needs a real WeCom application behind public HTTPS.
#   * compose-recovery needs the deployment Redis plus a volume backup drill.
# Both stay human-run against the test server, and `--gate all --dry-run` still
# lists them as NOT_RUN with the real reason instead of hiding them.
#
# The plugin-security gate does run here: hosted runners provide a Docker
# Engine, so the mandatory hostile runtime suite executes for real. If a runner
# ever loses that engine the gate reports NOT_RUN rather than a false PASS.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Tests and release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test suite
        run: python -m pytest -q
      - name: Release gates and tamper self-test
        # Every gate is reported; a FAIL always fails the build, while a gate
        # that genuinely cannot run here stays NOT_RUN with its reason.
        run: python scripts/release/run_gates.py --self-test --dry-run

  # The panel is a second deliverable with its own toolchain, so it gets its own
  # job: the Python gates never wait on npm, and a panel that does not build can
  # never hide behind a green test suite. The image is what Compose deploys, so
  # the image is what gets built here rather than a second `next build` on the
  # runner -- and then started, because a Dockerfile that builds is not yet a
  # container that serves.
  admin-panel:
    name: Admin panel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build the panel image
        run: docker build --file docker/web/Dockerfile --tag musicdl-admin:ci .
      - name: Serve one request from the built image
        # The read-only root filesystem and the two tmpfs mounts are the
        # Compose contract; exercising them here is what stops the image from
        # passing a build and then failing on the deployment host.
        run: |
          docker run --detach --name panel-smoke \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --publish 127.0.0.1:3999:3000 musicdl-admin:ci
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:3999/healthz > /dev/null; then
              echo "panel answered /healthz"
              exit 0
            fi
            sleep 2
          done
          docker logs panel-smoke
          exit 1

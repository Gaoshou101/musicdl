[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdl"
version = "0.1.0"
description = "Local multi-source music download service for WeCom workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "cryptography==50.0.1",
  "defusedxml==0.7.1",
  "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

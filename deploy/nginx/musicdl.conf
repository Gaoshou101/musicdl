upstream musicdl_app { server musicdl:8000; }
server { listen 80; server_name _; return 308 https://$host$request_uri; }
map $request_uri $release_loggable { default 1; ~^/wecom/callback(?:\?|$) 0; }
server {
    listen 443 ssl http2;
    server_name music.example.invalid;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log combined if=$release_loggable;
    location = /wecom/callback {
        proxy_pass http://musicdl_app/wecom/callback;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }
    location /static/ {
        alias /srv/musicdl/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    # The console and the /admin routes behind it are the same process, so
    # there is nothing left to route separately.
    location / { proxy_pass http://musicdl_app; }
}

# compose.prod.yaml — repository deployment manifest (production semantics).
#
# Who it is for : operators who already run Redis and want a pinned release image.
# Images        : wit7zz/musicdl + wit7zz/musicdl-plugin-runner, tag via MUSICDL_IMAGE_TAG
#                 (default `latest` — pin a numbered release such as 1.0.2). `build:` is kept so
#                 CI can build this exact topology from a checkout; plain `up -d` uses the image.
# Redis         : external and mandatory — set MUSICDL_REDIS__URL.
# Services      : 2, bound to 127.0.0.1 only; put a TLS reverse proxy in front (see deploy/).
# Start with    : MUSICDL_IMAGE_TAG=1.0.2 MUSICDL_REDIS__URL=redis://… \
#                 docker compose -f compose.prod.yaml up -d
#
# Which manifest do I want?
#   compose.yaml       dev / source build, external Redis, no restart policy or memory ceiling
#   compose.prod.yaml  same topology on the published images, plus restart + resource limits
#   compose.lite.yaml  no Redis at all (MUSICDL_DEPLOYMENT_MODE=lite), source build, WeCom refused
#   compose.quick.yaml one command: published images + bundled Redis, no checkout needed
services:
  musicdl:
    image: wit7zz/musicdl:${MUSICDL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/main/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MUSICDL_CONFIG__VERSION: "1"
      MUSICDL_REDIS__URL: "${MUSICDL_REDIS__URL:?set an external Redis URL}"
      MUSICDL_PLUGIN__SERVICE_URL: "http://plugin-runner:8080"
      MUSICDL_MEDIA__ROOT: /data/music
      MUSICDL_TELEGRAM__SESSION_ROOT: /data/telegram-sessions
      MUSICDL_ADMIN__STATE_PATH: "/data/app/admin-state.json"
      MUSICDL_ADMIN__COOKIE_SECURE: "${MUSICDL_ADMIN__COOKIE_SECURE:-true}"
    ports:
      - "127.0.0.1:${MUSICDL_PORT:-8000}:8000"
    volumes:
      - musicdl-media:/data/music
      - musicdl-app-data:/data/app
      - musicdl-telegram:/data/telegram-sessions
    networks: [default, plugin-control]
    command: ["uvicorn", "musicdl.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The console is not a service of its own: `docker/main/Dockerfile` builds it
  # into the image above and the app serves it from `/`.
  #
  # The plugin runner stays separate because it is the one place untrusted code
  # executes. It runs under the same boundary as everything else here -- non-root,
  # read-only root filesystem, no capabilities, hard CPU and memory limits --
  # reaches the app over the internal plugin-control network, and receives no
  # secrets.
  plugin-runner:
    image: wit7zz/musicdl-plugin-runner:${MUSICDL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/plugin/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    # Match the other manifests: the runner forks untrusted JS, so reclaim zombies (init) and
    # cap process counts (pids_limit) the same way compose.yaml / lite / quick do.
    init: true
    pids_limit: 64
    networks: [plugin-control]
    command: ["uvicorn", "musicdl_plugin_runner.app:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  musicdl-media:
  musicdl-app-data:
  musicdl-telegram:

networks:
  default:
  plugin-control:
    internal: true

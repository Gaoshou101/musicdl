services:
  musicdl:
    build:
      context: .
      dockerfile: docker/main/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MUSICDL_CONFIG__VERSION: "1"
      MUSICDL_REDIS__URL: "${MUSICDL_REDIS__URL:?set an external Redis URL}"
      MUSICDL_PLUGIN__SERVICE_URL: "http://plugin-runner:8080"
      MUSICDL_MEDIA__ROOT: /data/music
      MUSICDL_TELEGRAM__SESSION_ROOT: /data/telegram-sessions
      MUSICDL_ADMIN__STATE_PATH: "/data/app/admin-state.json"
    ports:
      - "127.0.0.1:${MUSICDL_PORT:-8000}:8000"
    volumes:
      - musicdl-media:/data/music
      - musicdl-app-data:/data/app
      - musicdl-telegram:/data/telegram-sessions
    networks: [default, plugin-control]
    command: ["uvicorn", "musicdl.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The administration panel: the same boundaries as the service it manages,
  # on its own loopback port. It talks to the app over the default network by
  # service name.
  admin-panel:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      # Read at build time: Next bakes the rewritten origin into the server.
      args:
        MUSICDL_API_ORIGIN: "http://musicdl:8000"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m
    ports:
      - "127.0.0.1:${MUSICDL_ADMIN_PORT:-3000}:3000"
    networks: [default]
    depends_on:
      musicdl:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  plugin-runner:
    build:
      context: .
      dockerfile: docker/plugin/Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks: [plugin-control]
    command: ["uvicorn", "musicdl_plugin_runner.app:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  musicdl-media:
  musicdl-app-data:
  musicdl-telegram:

networks:
  default:
  plugin-control:
    internal: true
